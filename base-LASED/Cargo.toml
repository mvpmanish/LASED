[package]
name = "lased-rs"
version = "2.0.0"
edition = "2021"
description = "Rust backend for LASED: parallel adaptive integration of sparse Lindblad master equations"
license = "MIT"
publish = false

[lib]
name = "_lased_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"
num-complex = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
